[project]
name = "biomni-adme-ml-skill-runtime"
version = "0.2.0"
description = "Leakage-resistant single-endpoint ADME modeling tools for Biomni"
requires-python = ">=3.11,<3.13"
dependencies = [
  "chembl-structure-pipeline>=1.2,<2",
  "joblib>=1.3,<2",
  "mapie>=1.0,<2",
  "molfeat>=0.11,<1",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.7,<3",
  "rdkit>=2024.3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "splito>=0.1.4,<0.2",
  "xgboost>=2.1,<4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
